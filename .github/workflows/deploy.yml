name: Deploy NodeWarden

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    uses: ./.github/workflows/security-extra.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  codeql:
    name: CodeQL scans
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read

  check:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Type check
        run: |
          npx --no-install tsc -p tsconfig.json --noEmit
          npx --no-install tsc -p webapp/tsconfig.json --noEmit
      - name: Security and compatibility tests
        run: |
          npm run test:deploy-config
          npm run test:security-results
          npm run test:security-regressions
          npm run test:backup-listing
          npm run test:web-security
          npm run test:web-crypto
          npm run test:config-compatibility
          npm run test:vault-compatibility
          npm run test:notifications-security
          npm run test:webauthn-connectors
      - name: Build Web Vault
        run: npm run build

  release-gate:
    name: Release gate
    needs: [check, security, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every build and security job to succeed
        env:
          BUILD_RESULT: ${{ needs.check.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$CODEQL_RESULT" = success

  deploy:
    name: Deploy existing production Worker
    needs: release-gate
    if: github.repository == 'tiny656/nodewarden' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: nodewarden-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG: warn
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Build Web Vault
        run: npm run build
      - name: Prepare private configuration and verify existing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          NODEWARDEN_DOMAIN: ${{ secrets.NODEWARDEN_DOMAIN }}
        run: |
          node scripts/prepare-deploy-config.mjs
          node scripts/verify-deployment.mjs preflight
      - name: Deploy with the locked Wrangler version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node node_modules/wrangler/bin/wrangler.js deploy -c wrangler.ci.toml
      - name: Verify live service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          NODEWARDEN_DOMAIN: ${{ secrets.NODEWARDEN_DOMAIN }}
        run: node scripts/verify-deployment.mjs smoke
      - name: Remove generated configuration
        if: always()
        run: rm -f wrangler.ci.toml
